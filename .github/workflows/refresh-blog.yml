# Refreshes the Bhopal trend archive: fetches new posts from X, rebuilds the
# blog post, and pushes the result. Every push to main deploys both Netlify
# projects (the main site's /blog/ and claude-bhopal-blog).
#
# Cadence: every 10 minutes. GitHub's cron trigger never fired for this repo
# (see the schedule below, kept as a backup), so each run starts the next one
# itself 10 minutes after it began. Because runs share a concurrency group,
# extra triggers (cron, manual) never overlap or pile up; at most one run is
# pending at a time. To stop the loop, disable the workflow:
#   gh workflow disable refresh-blog.yml
# To start it again: gh workflow enable refresh-blog.yml && gh workflow run refresh-blog.yml
name: Refresh Bhopal trend archive

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # backup only; offset from :00 where GitHub drops runs
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets a run dispatch the next one

concurrency:
  group: refresh-blog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Note when this run started
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (resizes images and avatars)
        run: pip install --quiet pillow

      - name: Note what is already saved
        id: before
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("blog/fable-5-1-build-days-bhopal/tweets.json"))["meta"]
          print("n=" + str(m["counts"]["posts_total"]))
          print("t=" + m["captured_at_utc"])
          PY

      - name: Fetch new posts from the trend
        run: python3 blog/tools/capture_x_trend.py 2098201852286324889 --keyword bhopal --out blog/fable-5-1-build-days-bhopal

      - name: Add the replies X shows under saved posts
        run: python3 blog/tools/expand_x_archive.py --out blog/fable-5-1-build-days-bhopal --keyword bhopal --max-pages 40

      # Once an hour: X search through a public Nitter mirror. The mirror sits
      # behind a browser challenge and rate-limits fast, so this uses Scrapling's
      # stealth browser, few pages, long pauses, and never fails the run.
      - name: Is the hourly mirror search due?
        id: search
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, datetime as d
          m = json.load(open("blog/fable-5-1-build-days-bhopal/tweets.json"))["meta"].get("search") or {}
          due = True
          if m.get("last_run_utc"):
              t = d.datetime.strptime(m["last_run_utc"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=d.timezone.utc)
              due = (d.datetime.now(d.timezone.utc) - t).total_seconds() > 3300
          print("due=" + str(due).lower())
          PY

      - name: Cache the stealth browser
        if: steps.search.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/camoufox
            ~/.cache/ms-playwright
            ~/.cache/pip
          key: scrapling-browsers-v2

      - name: Install Scrapling and its browser
        if: steps.search.outputs.due == 'true'
        continue-on-error: true
        # `scrapling install` fetches Camoufox but not the Chromium that the
        # stealth session launches through patchright; without it every search
        # run died with "Executable doesn't exist at ~/.cache/ms-playwright/chromium-…".
        run: pip install --quiet "scrapling[fetchers]" && scrapling install && python -m patchright install --with-deps chromium

      - name: Search X through a Nitter mirror
        if: steps.search.outputs.due == 'true'
        continue-on-error: true
        run: python3 blog/tools/harvest_x_search.py --out blog/fable-5-1-build-days-bhopal --keyword bhopal --queries "bhopal fable" "bhopal claude" "bhopal anthropic" "bhopal buildathon" --max-pages 2 --pause 10

      - name: Rebuild the post
        run: python3 blog/fable-5-1-build-days-bhopal/build.py

      # Engagement counts change on every run, so without a guard the archive
      # would be committed (and both sites redeployed) every 10 minutes.
      # Commit when new posts arrived, or every 3 hours so the counts stay fresh.
      - name: Commit and push when there are new posts (or every 3 hours)
        run: |
          git add -A blog
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          AFTER=$(python3 -c "import json;print(json.load(open('blog/fable-5-1-build-days-bhopal/tweets.json'))['meta']['counts']['posts_total'])")
          NEW=$(( AFTER - ${{ steps.before.outputs.n }} ))
          AGE=$(python3 -c "import datetime as d;t=d.datetime.strptime('${{ steps.before.outputs.t }}','%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=d.timezone.utc);print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()))")
          if [ "$NEW" -le 0 ] && [ "$AGE" -lt 10800 ]; then
            echo "No new posts ($AFTER saved); last refresh was $((AGE / 60)) minutes ago. Not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Bhopal trend archive: $AFTER posts ($NEW new)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Start the next run 10 minutes after this one began
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(( ${{ steps.clock.outputs.start }} + 600 - $(date +%s) ))
          if [ "$WAIT" -gt 600 ]; then WAIT=600; fi
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT s so runs stay 10 minutes apart."
            sleep "$WAIT"
          fi
          gh workflow run refresh-blog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Next run dispatched."
